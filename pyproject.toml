[project]
name = "reading-tracker"
version = "0.1.0"
description = "Personal reading tracker with a public Streamlit dashboard."
readme = "README.md"
authors = [
    { name = "feitandodatascience", email = "279754069+feitandodatascience@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Notebooks use math-style names such as X (design matrix) and N (sample size).
"notebooks/*.ipynb" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
